name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run repo secret scan
        shell: pwsh
        run: ./scripts/scan-secrets.ps1 -Ci

      - name: Upload sanitized findings
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: secret-scan-findings
          path: secret-scan-findings.txt
          if-no-files-found: ignore
