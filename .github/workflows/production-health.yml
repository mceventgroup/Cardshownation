name: Production health
on:
  workflow_dispatch:
  schedule:
    # Leave time between database probes for Neon's 5-minute scale-to-zero window.
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node scripts/check-production-health.mjs
